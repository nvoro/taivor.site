<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiwor Site</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            color: #8b949e;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .status {
            display: inline-block;
            background-color: rgba(56, 139, 253, 0.1);
            color: #58a6ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(56, 139, 253, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>taiwor.site</h1>
        <p>Привет! Этот сайт успешно работает и размещен на платформе GitHub Pages.</p>
        <div class="status">● Проверка связи успешна</div>
    </div>

</body>
</html>
