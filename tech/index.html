<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TAIVOR — Technical Break</title>

  <link rel="icon" type="image/png" href="/resources/favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
      background: #ff252b;
    }

    .technical-break {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      color: #fff52a;

      background:
        radial-gradient(
          ellipse at 50% 10%,
          rgba(255, 215, 125, .82) 0%,
          rgba(255, 125, 70, .25) 27%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 76% 22%,
          rgba(255, 220, 105, .72) 0%,
          transparent 29%
        ),
        radial-gradient(
          ellipse at 31% 68%,
          rgba(255, 112, 42, .75) 0%,
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #ff2429 0%,
          #ff3130 42%,
          #ff272b 100%
        );
    }

    .technical-break::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      opacity: .16;
      mix-blend-mode: overlay;

      background-image:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,.75) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle at 70% 40%,
          rgba(0,0,0,.45) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle at 45% 80%,
          rgba(255,255,255,.55) 0 1px,
          transparent 1.5px
        );

      background-size:
        5px 5px,
        7px 7px,
        6px 6px;
    }

    .content {
      position: relative;
      z-index: 1;

      width: 90%;
      max-width: 1100px;

      text-align: center;
    }

    .title {
      margin: 0;

      font-size: clamp(48px, 8vw, 105px);
      line-height: .9;

      font-weight: 700;

      letter-spacing: -5px;
    }

    .subtitle {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 24px;

      margin-top: 40px;

      font-size: clamp(14px, 1.7vw, 21px);
      font-weight: 400;
    }

    .line {
      width: 150px;
      height: 2px;

      background: #fff52a;
    }

    .bottom {
      margin-top: 18px;

      font-size: clamp(12px, 1.3vw, 17px);

      letter-spacing: .2px;
    }

    @media (max-width: 700px) {

      .title {
        letter-spacing: -2px;
      }

      .subtitle {
        gap: 12px;
        margin-top: 30px;
      }

      .line {
        width: 70px;
      }
    }

    @media (max-width: 480px) {

      .title {
        font-size: 48px;
        letter-spacing: -1.5px;
      }

      .subtitle {
        font-size: 13px;
      }

      .line {
        width: 45px;
      }

      .bottom {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="technical-break">

    <div class="content">

      <h1 class="title">
        TECHNICAL<br>
        BREAK
      </h1>

      <div class="subtitle">
        <span>ERROR</span>

        <span class="line"></span>

        <span>503</span>
      </div>

    </div>

  </main>

</body>
</html>
